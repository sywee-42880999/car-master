name: Apply locked destination UI
on: push
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified lock UI
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > index.html
          printf '%s' '' | base64 -d | gzip -d > game.css
          printf '%s' '' | base64 -d | gzip -d > game.js
          rm -f .github/workflows/apply-lock-ui.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html game.css game.js .github/workflows/apply-lock-ui.yml
          git commit -m 'Mark locked test and inventory destinations'
          git push
