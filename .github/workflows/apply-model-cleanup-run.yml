name: Apply verified Model Master assets
on:
  push:
    paths:
      - .github/workflows/apply-model-cleanup-run.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified files
        run: |
          python3 - <<'PY'
          import base64, pathlib, tarfile
          s = pathlib.Path('.github/workflows/apply-model-cleanup.yml').read_text()
          payload = s.split("<<'ARCHIVE'", 1)[1].split('ARCHIVE', 1)[0]
          p = pathlib.Path('/tmp/cleanup.tar.gz')
          p.write_bytes(base64.b64decode(payload))
          with tarfile.open(p) as t:
              t.extractall('.', filter='data')
          PY
      - name: Commit assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add WORK_QUEUE.md game.css index.html model-master.css model-master.html model-master/index.html data/model-asset-cleanup-2026-09-12.json images/vehicles/hyundai images/vehicles/kia
          git diff --cached --quiet && exit 0
          git commit -m 'Clean vehicle assets and raise learning CTAs'
          git push
