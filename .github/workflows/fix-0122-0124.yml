name: Fix 0122-0124 distinct crops

on:
  push:
    branches: [main]
    paths:
      - "tools/fix_0122_0124.py"
      - ".github/workflows/fix-0122-0124.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pillow
      - run: python tools/fix_0122_0124.py
      - name: Commit corrected distinct crops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/parts/0122.jpg images/parts/0123.jpg images/parts/0124.jpg
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Correct distinct crops for 0122-0124"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
