name: Integrate coffee reward UI
on: push
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified UI files
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > index.html
          printf '%s' '' | base64 -d | gzip -d > game.css
          printf '%s' '' | base64 -d | gzip -d > game.js
          mkdir -p images/rewards
          curl -fL 'https://img.79plus.co.kr/megahp/manager/upload/menu/20250320000925_1742396965069_ekSqAIVc1L.jpg' -o images/rewards/mega-americano.jpg
          test $(wc -c < images/rewards/mega-americano.jpg) -eq 131315
          rm -f .github/workflows/integrate-coffee-ui.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html game.css game.js images/rewards/mega-americano.jpg .github/workflows/integrate-coffee-ui.yml
          git commit -m 'Integrate coffee rewards into current main'
          git push
