name: CAR MASTER production preview

on:
  push:
    branches: [main]
    paths:
      - "tools/build_production_preview.py"
      - ".github/workflows/production-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pillow
      - run: python tools/build_production_preview.py
      - uses: actions/upload-artifact@v4
        with:
          name: car-master-production-preview
          path: production-preview/
      - name: Commit batch 33
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/master.json research/backlog-recovery-33-final-22.md
          for id in 0265 0294 0337 0353 0369 0370 0371 0372 0373 0374 0375 0397 0414 0415 0416 0452 0465 0493 0494 0495 0496 0500; do
            if [ -f "images/parts/$id.jpg" ]; then git add "images/parts/$id.jpg"; fi
          done
          if git diff --cached --quiet; then
            echo "No validated batch-33 changes."
          else
            git commit -m "Recover final 22 cards batch 33"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
