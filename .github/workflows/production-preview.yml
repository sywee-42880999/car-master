name: CAR MASTER production preview

on:
  push:
    branches: [main]
    paths:
      - "tools/build_production_preview.py"
      - ".github/workflows/production-preview.yml"
      - "images/source/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pillow
      - run: python tools/build_production_preview.py
      - uses: actions/upload-artifact@v4
        with:
          name: car-master-production-preview
          path: production-preview/
      - name: Commit backlog recovery 12
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/master.json research/backlog-recovery-12.md
          for id in 0214 0215 0216 0217 0223 0224 0225; do
            if [ -f "images/parts/$id.jpg" ]; then git add "images/parts/$id.jpg"; fi
          done
          if git diff --cached --quiet; then
            echo "No validated backlog recovery changes."
          else
            git commit -m "Recover validated backlog assets batch 12"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
