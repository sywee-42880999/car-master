name: CAR MASTER production preview

on:
  push:
    branches: [main]
    paths:
      - "tools/build_production_preview.py"
      - ".github/workflows/production-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pillow
      - run: python tools/build_production_preview.py
      - uses: actions/upload-artifact@v4
        with:
          name: car-master-production-preview
          path: production-preview/
      - name: Commit batch 29
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/master.json research/backlog-recovery-29-original-mechanical-schematics.md
          for id in 0151 0152 0153 0155 0157 0163 0165 0168 0169 0170 0171 0172 0177 0181 0183 0184 0185 0187 0188 0189 0190; do
            if [ -f "images/parts/$id.jpg" ]; then git add "images/parts/$id.jpg"; fi
          done
          if git diff --cached --quiet; then
            echo "No validated batch-29 changes."
          else
            git commit -m "Recover original mechanical schematics batch 29"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
