name: CAR MASTER production preview

on:
  push:
    branches: [main]
    paths:
      - "tools/build_production_preview.py"
      - ".github/workflows/production-preview.yml"
      - "images/source/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pillow
      - run: python tools/build_production_preview.py
      - uses: actions/upload-artifact@v4
        with:
          name: car-master-production-preview
          path: production-preview/
      - name: Commit Chat-approved production crops and QA handoff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/parts/0291.jpg images/parts/0292.jpg images/parts/0293.jpg images/parts/0295.jpg images/parts/0311.jpg images/parts/0312.jpg images/parts/0313.jpg images/parts/0314.jpg images/parts/0316.jpg research/0291-0300-production-result.md research/0301-0310-production-result.md research/0311-0320-production-result.md
          if git diff --cached --quiet; then
            echo "No production crop changes to commit."
          else
            git commit -m "Produce validated 0291-0320 Chat production assets"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
