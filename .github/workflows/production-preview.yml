name: CAR MASTER production preview

on:
  push:
    branches: [main]
    paths:
      - "tools/build_production_preview.py"
      - ".github/workflows/production-preview.yml"
      - "images/source/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pillow
      - run: python tools/build_production_preview.py
      - uses: actions/upload-artifact@v4
        with:
          name: car-master-production-preview
          path: production-preview/
      - name: Commit Chat-approved production crops and QA handoff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/parts/0121.jpg images/parts/0122.jpg images/parts/0123.jpg images/parts/0124.jpg images/parts/0126.jpg images/parts/0127.jpg images/parts/0128.jpg images/parts/0129.jpg images/parts/0130.jpg research/0121-0130-production-result.md
          if git diff --cached --quiet; then
            echo "No production crop changes to commit."
          else
            git commit -m "Produce 0121-0130 Chat production assets"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
