name: Collect official vehicle images

on:
  workflow_dispatch:
  push:
    paths:
      - data/models-latest.json
      - scripts/collect_vehicle_images.py
      - .github/workflows/vehicle-images.yml

permissions:
  contents: write

concurrency:
  group: vehicle-image-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow
      - name: Collect and normalize official images
        run: python scripts/collect_vehicle_images.py
      - name: Commit collected assets
        run: |
          git config user.name "car-master-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/model-image-status.json images/vehicles 2>/dev/null || git add -A data/model-image-status.json
          if git diff --cached --quiet; then
            echo "No image changes"
            exit 0
          fi
          git commit -m "Collect official vehicle images"
          git push
