<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="CAR MASTER BLACK 자동차 용어 학습 프리뷰">
  <title>CAR MASTER BLACK</title>
  <link rel="stylesheet" href="./black-preview.css?v=1">
  <style>.toast:empty{display:none}</style>
</head>
<body>
  <main class="phone-shell">
    <header class="intro"><div><h1>당신은 자동차 용어를 얼마나 아나요?</h1><p>사진으로 확인하고, 아는 카드는 숨기세요.</p></div><button class="menu" type="button" aria-label="메뉴">☰</button></header>
    <section class="rank" aria-label="학습 진행"><div class="rank-line"><strong id="rankName">Beginner · 비기너</strong><span id="knownCount">0 / 0 · 0%</span></div><div class="progress"><span id="progressBar"></span></div></section>
    <nav class="tabs" id="tabs" aria-label="카테고리"></nav>
    <div class="deck-meta"><span id="position">0 / 0</span><button id="restore" type="button">숨긴 카드 보기</button></div>
    <article class="card" id="card" aria-live="polite">
      <div class="visual"><img id="partImage" alt=""><span id="itemId" class="item-id"></span></div>
      <div class="copy"><h2 id="term">불러오는 중</h2><p id="alias" class="alias"></p><p id="ko" class="ko"></p><div class="explain"><p id="descriptionEn"></p><p id="descriptionKo"></p></div></div>
    </article>
    <div class="controls"><button id="prev" class="arrow" type="button" aria-label="이전 카드">‹</button><button id="know" class="know" type="button">알아요 · 숨기기 ✓</button><button id="next" class="arrow" type="button" aria-label="다음 카드">›</button></div>
    <p class="footnote">카드를 좌우로 밀어 넘기세요</p><div id="toast" class="toast" role="status"></div>
  </main>
  <script src="./black-preview.js?v=1"></script>
</body>
</html>
