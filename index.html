<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="CAR MASTER BLACK 자동차 용어 학습 프리뷰">
  <title>CAR MASTER BLACK</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./black-preview.css?v=2">
  <style>
.toast:empty{display:none}
.ko{display:none}
/* Keep the learning action inside the usable mobile viewport. */
@media(max-width:699px){
  .phone-shell{height:100svh;height:100dvh;min-height:0;display:flex;flex-direction:column;padding:12px 16px max(8px,env(safe-area-inset-bottom));gap:8px}
  .intro,.rank,.tabs,.deck-meta,.controls,.deck-tools{flex-shrink:0;margin-top:0;margin-bottom:0}
  .intro h1{font-size:1.05rem}.intro p{font-size:.7rem;margin-top:4px}
  .rank-line{font-size:.68rem}.progress{margin-top:6px}
  .tabs{padding-bottom:0}.tab{min-height:34px}
  .deck-meta{margin-inline:2px}
  .card{flex:1;min-height:0;display:flex;flex-direction:column}
  .visual{flex:1;min-height:0;aspect-ratio:auto}
  .visual img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  .copy{flex:0 0 218px;min-height:218px;max-height:218px;overflow:hidden;padding:12px 17px}
  .copy h2{font-size:clamp(1.05rem,5vw,1.5rem);line-height:1.12;overflow-wrap:anywhere}
  .alias:empty{display:none}.ko{font-size:.9rem;margin-top:6px}
  .explain{margin-top:8px;padding:8px 0 0}.explain p{font-size:.7rem;line-height:1.35}
  .controls button{min-height:44px}.footnote{font-size:.6rem}
  .empty{min-height:0;overflow:auto;padding:20px}
}
@media(max-width:699px) and (max-height:540px){
  .phone-shell{gap:5px;padding-top:8px}.intro p,.footnote{display:none}
  .card{flex-direction:row}.visual{flex:1}.copy{flex:1;max-height:100%}
}
</style>
</head>
<body>
  <main class="phone-shell">
    <header class="intro"><div><h1>당신은 자동차 용어를 얼마나 아나요?</h1><p>사진으로 확인하고, 아는 카드는 숨기세요.</p></div><button class="menu" type="button" aria-label="메뉴">☰</button></header>
    <section class="rank" aria-label="학습 진행"><div class="rank-line"><strong id="rankName">Beginner · 비기너</strong><span id="knownCount">0 / 0 · 0%</span></div><div class="progress"><span id="progressBar"></span></div></section>
    <nav class="tabs" id="tabs" aria-label="카테고리"></nav>
    <div class="deck-meta"><span id="position">0 / 0</span><button id="restore" type="button">숨긴 카드 보기</button></div>
    <article class="card" id="card" aria-live="polite">
      <div class="visual"><img id="partImage" alt=""><span id="itemId" class="item-id"></span></div>
      <div class="copy"><h2 id="term">불러오는 중</h2><p id="alias" class="alias"></p><p id="ko" class="ko"></p><div class="explain"><p id="descriptionEn"></p><p id="descriptionKo"></p></div></div>
    </article>
    <div class="controls"><button id="prev" class="arrow" type="button" aria-label="이전 카드">‹</button><button id="know" class="know" type="button">알아요 · 숨기기 ✓</button><button id="next" class="arrow" type="button" aria-label="다음 카드">›</button></div>
    <div class="deck-tools"><button id="autoplay" class="autoplay" type="button" aria-pressed="false">▶ AUTO</button><p class="footnote">SWIPE ↔</p></div><div id="toast" class="toast" role="status"></div>
  </main>
  <script src="./black-preview.js?v=2"></script>
</body>
</html>
