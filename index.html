<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAR MASTER</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#132238;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1180px;margin:auto;padding:18px}h1{margin:0;font-size:30px}.sub{color:#667085;margin:6px 0 18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.pct{font-weight:800;background:#10233f;color:white;padding:8px 12px;border-radius:999px}.tools{display:flex;gap:8px;margin-bottom:16px}.tools input{flex:1;padding:11px;border:1px solid #d0d7e0;border-radius:10px}.tools a{padding:10px 12px;border:1px solid #dce2ea;background:white;border-radius:10px;color:#132238;text-decoration:none;font-weight:700}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:white;border:1px solid #e1e6ed;border-radius:16px;overflow:hidden}.visual{position:relative;aspect-ratio:4/3;background:#e9edf2}.visual img{width:100%;height:100%;object-fit:cover}.pin{position:absolute;width:18px;height:18px;margin:-9px;border-radius:50%;background:#e32020;border:3px solid white;box-shadow:0 1px 8px #0005}.pin.soft{width:58px;height:34px;margin:-17px -29px;border:2px solid #e32020;background:#e3202040}.meta{padding:13px 14px}.id{font-size:13px;font-weight:900;color:#7b8798}.en{font-size:18px;font-weight:900;margin-top:6px}.ko{color:#536174;margin-top:4px}.state{float:right;font-size:11px;font-weight:900;background:#e9f6ef;color:#17633a;padding:5px 8px;border-radius:999px}.state.r{background:#fff3d9;color:#8a5a00}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.wrap{padding:11px}.grid{grid-template-columns:1fr}.top{align-items:flex-start}.pct{font-size:12px}h1{font-size:25px}}</style></head><body><div class="wrap"><div class="top"><div><h1>CAR MASTER</h1><div class="sub">자동차 파트 비주얼 단어장 · 검토용</div></div><div class="pct">2% · 10/500 COMPLETE</div></div><div class="tools"><input id="q" placeholder="ID · English · 한글 검색"><a href="master.html">관리표</a><a href="data/source_registry.json">SOURCE</a></div><div class="grid" id="grid"></div></div><script>const views={'0001':['front',49,30,1],'0002':['front',62,46,0],'0003':['front',48,18,1],'0004':['side',42,31,0],'0005':['side',51,25,1],'0006':['side',54,12,1],'0007':['side',27,66,0],'0008':['side',27,66,0],'0009':['front',50,50,0],'0010':['front',50,43,0],'0011':['side',54,43,1],'0012':['rear',68,43,1],'0013':['rear',67,43,1],'0014':['rear',67,42,0],'0015':['rear',66,54,0],'0016':['rear',50,40,1],'0017':['rear',50,53,0],'0018':['rear',51,13,0],'0019':['rear',50,30,1],'0020':['rear',50,18,1],'0021':['front',50,61,1],'0022':['rear',50,67,1],'0023':['front',50,50,1],'0024':['front',50,18,1],'0025':['rear',50,28,1],'0026':['side',55,39,0],'0027':['rear',50,64,0],'0028':['front',61,45,0],'0029':['rear',50,16,1],'0030':['side',54,10,1]};const imgs={front:'images/venue/front.jpg',side:'images/venue/side.jpg',rear:'images/venue/rear.jpg'};fetch('data/master.json?v=1405').then(r=>r.json()).then(d=>{const grid=document.getElementById('grid'),q=document.getElementById('q');function draw(){const s=q.value.toLowerCase();grid.innerHTML=d.items.filter(x=>!s||[x.id,x.en,x.ko].join(' ').toLowerCase().includes(s)).map(x=>{const v=views[x.id],research=x.status==='RESEARCH';return `<article class="card"><div class="visual"><img src="${imgs[v[0]]}" alt="${x.en}"><span class="pin ${v[3]?'soft':''}" style="left:${v[1]}%;top:${v[2]}%"></span></div><div class="meta"><span class="state ${research?'r':''}">${research?'RESEARCH':'REVIEW'}</span><div class="id">${x.id}</div><div class="en">${x.en}</div><div class="ko">${x.ko}</div></div></article>`}).join('')}q.oninput=draw;draw()});</script></body></html>
