<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAR MASTER</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#122137;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}.wrap{max-width:1200px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}h1{margin:0;font-size:30px}.sub{margin:5px 0 18px;color:#667085}.pct{background:#10233f;color:#fff;padding:8px 12px;border-radius:99px;font-weight:800}.tools{display:flex;gap:8px;margin-bottom:16px}.tools input{flex:1;padding:11px;border:1px solid #ccd4df;border-radius:10px}.tools a{padding:10px 12px;border:1px solid #d9e0e8;background:#fff;border-radius:10px;text-decoration:none;color:#122137;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid #dfe5ec;border-radius:16px;overflow:hidden}.visual{aspect-ratio:4/3;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}.visual img{width:100%;height:100%;object-fit:contain}.meta{padding:13px 14px}.id{font-size:12px;font-weight:900;color:#778397}.en{font-size:18px;font-weight:900;margin-top:5px}.ko{color:#536174;margin-top:3px}.src{display:inline-block;margin-top:9px;font-size:11px;color:#667085}.fallback{font-size:12px;color:#8b95a5;text-align:center;padding:20px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.wrap{padding:10px}.grid{grid-template-columns:1fr}.top{align-items:flex-start}h1{font-size:25px}.pct{font-size:12px}}</style></head><body><div class="wrap"><div class="top"><div><h1>CAR MASTER</h1><div class="sub">Hyundai Owner’s Manual 기반 · 실제 파트 이미지 검토</div></div><div class="pct">0001–0020 REVIEW</div></div><div class="tools"><input id="q" placeholder="ID · English · 한글 검색"><a href="master.html">관리표</a></div><div id="grid" class="grid"></div></div><script>const F='https://ownersmanual.hyundai.com/full_webhelp/LX3/2026/en_US/images/1C_OutsideVehicleFrontOverview.jpg.png';const R='https://ownersmanual.hyundai.com/full_webhelp/LX3/2026/en_US/images/1C_OutsideVehicleRearOverview.jpg.png';const I5='https://ownersmanual.hyundai.com/full_webhelp/NE1a/2025/en_US/images/2C_HowToUseChargingDoor.jpg.png';const ANT='https://ownersmanual.hyundai.com/full_webhelp/LX3/2026/en_US/images/2C_Antenna.jpg.png';const WIP='https://ownersmanual.hyundai.com/full_webhelp/LX2/2025/en_US/images/B0452KO05.jpg.png';const STOP='https://ownersmanual.hyundai.com/full_webhelp/NX4/2025/en_US/images/2C_HighMountedStopLamp.jpg.png';const LAMP='https://ownersmanual.hyundai.com/full_webhelp/NX4a/2026/en_US/images/2C_RearLampOverview.jpg.png';const REV='https://ownersmanual.hyundai.com/full_webhelp/MX5a/2024/en_US/images/2C_BackupLampChange1.jpg.png';const CAM='https://ownersmanual.hyundai.com/full_webhelp/AXEV/2025/en_GN/images/2C_WideRearViewCamera.jpg.png';const FD='https://ownersmanual.hyundai.com/full_webhelp/LX3/2026/en_US/images/2C_FuelInletDoor.jpg.png';const items=[['0001','HOOD','후드',F],['0002','HEADLIGHTS','헤드램프',F],['0003','FRONT WIPER BLADES','앞유리 와이퍼 블레이드',F],['0004','SIDE VIEW MIRRORS','실외 미러',F],['0005','WINDOWS','유리창',F],['0006','SUNROOF','선루프',F],['0007','TIRES','타이어',F],['0008','WHEELS','휠',F],['0009','FRONT RADAR','전방 레이더',F],['0010','FRONT VIEW CAMERA','전방 카메라',F],['0011','DOORS','도어',R],['0012','FUEL FILLER DOOR','연료 주입구 도어',FD],['0013','ELECTRIC CHARGING DOOR','충전구 도어',I5],['0014','REAR COMBINATION LIGHTS','리어 콤비네이션 램프',LAMP],['0015','REVERSE LIGHTS','후진등',REV],['0016','LIFTGATE','리프트게이트',R],['0017','WIDE-REAR VIEW CAMERA','광각 후방 카메라',CAM],['0018','ANTENNA','안테나',ANT],['0019','REAR WINDOW WIPER BLADE','후면 와이퍼 블레이드',WIP],['0020','HIGH MOUNTED STOP LIGHT','보조 제동등',STOP]];const grid=document.getElementById('grid'),q=document.getElementById('q');function draw(){let s=q.value.toLowerCase();grid.innerHTML=items.filter(x=>!s||x.join(' ').toLowerCase().includes(s)).map(x=>`<article class="card"><div class="visual"><img src="${x[3]}" alt="${x[1]}" onerror="this.style.display='none';this.parentNode.innerHTML='<div class=\'fallback\'>OFFICIAL IMAGE LOAD ERROR<br>소스 교체 필요</div>'"></div><div class="meta"><div class="id">${x[0]}</div><div class="en">${x[1]}</div><div class="ko">${x[2]}</div><span class="src">HYUNDAI OWNER’S MANUAL</span></div></article>`).join('')}q.oninput=draw;draw();</script></body></html>
